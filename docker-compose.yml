# Local development environment.
# Usage: cp .env.example .env  (fill in values)  &&  docker compose up
name: kitaphane

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kitaphane}
      POSTGRES_USER: ${POSTGRES_USER:-kitaphane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025" # Web UI: http://localhost:8025
      - "1025:1025" # SMTP

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DATABASE_CONNECTION_STRING: Host=postgres;Port=5432;Database=${POSTGRES_DB:-kitaphane};Username=${POSTGRES_USER:-kitaphane};Password=${POSTGRES_PASSWORD}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    ports:
      - "5000:5000" # API + Swagger: http://localhost:5000/swagger
    volumes:
      - ./backend:/src
      - backend-build:/build
      - nuget-cache:/root/.nuget/packages
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      API_PROXY_TARGET: http://backend:5000
    ports:
      - "5173:5173" # App: http://localhost:5173
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres-data:
  backend-build:
  nuget-cache:
  frontend-node-modules:
